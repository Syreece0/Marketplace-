{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Password changed" %} - {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="container">
  <div class="card auth-card text-center">
    <i class="bi bi-check-circle" style="font-size:2.5rem;color:var(--tw-success)" aria-hidden="true"></i>
    <h1 class="h3 mt-3">{% trans "Your password has been changed" %}</h1>
    <p class="text-muted">{% trans "You can now sign in with your new password." %}</p>
    <a class="btn btn-primary" href="{% url 'accounts:login' %}">{% trans "Sign in" %}</a>
  </div>
</div>
{% endblock %}
