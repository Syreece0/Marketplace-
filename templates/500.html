<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 1rem; }
    .box { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 2.5rem 2rem; max-width: 460px; text-align: center; }
    h1 { color: #172554; font-size: 1.5rem; }
    a { display: inline-block; margin-top: 1rem; background: #172554; color: #fff; padding: 0.6rem 1.2rem; border-radius: 8px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Something went wrong on our side</h1>
    <p>We have been notified and are looking into it. Please try again in a few minutes.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
